[project]
name = "automaton-auditor"
version = "0.1.0"
description = "TRP1 Week 2: Deep LangGraph-based Digital Courtroom auditor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langchain>=0.3.0",
  "langgraph>=0.2.0",
  "langchain-openai>=0.2.0",
  "pydantic>=2.7.0",
  "typing-extensions>=4.9.0",
  "python-dotenv>=1.0.0",
  "pdfplumber>=0.11.0",
  "pymupdf>=1.24.0",
  "python-docx>=1.1.0",
  "gitpython>=3.1.40",
  "docling>=1.0.0 ; python_version >= '3.11'",
]

[project.optional-dependencies]
dev = ["ruff>=0.5.0", "mypy>=1.10.0"]

[tool.uv]
dev-dependencies = ["ruff>=0.5.0", "mypy>=1.10.0"]

